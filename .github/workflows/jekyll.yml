name: Jekyll build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 from Oct 19, 2026; bump deliberately after a test run
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: _plugins/git_last_modified.rb dates pages from git

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Add page body text to the search index
        run: python3 scripts/enrich_search_index.py _site
        continue-on-error: true

      - name: Check search index is valid JSON
        run: |
          python3 -c "import json,collections,os; d=json.load(open('_site/search.json')); print(len(d), 'entries', dict(collections.Counter(x['type'] for x in d)), os.path.getsize('_site/search.json')//1024, 'KB'); [print('::notice::search index cuts off', x['url'], 'at 30,000 chars - later text is not searchable') for x in d if x['type'] == 'Post' and len(x['text']) >= 29990]"

      - name: Check feeds are well-formed Atom
        run: python3 -c "import glob,xml.etree.ElementTree as E; fs=['_site/feed.xml']+sorted(glob.glob('_site/feed/*.xml')); [print(f, len(E.parse(f).getroot().findall('{http://www.w3.org/2005/Atom}entry')), 'entries') for f in fs]"

      - name: Check JSON Feed is valid with absolute links
        run: python3 -c "import json; f=json.load(open('_site/feed.json')); assert f['version'].endswith('/1.1'); it=f['items']; assert it and all(i['id'] and i['url'].startswith('https://') and i['content_html'] for i in it); bad=[i['url'] for i in it if 'href=\"/' in i['content_html'] or 'src=\"/' in i['content_html']]; assert not bad, bad; print(len(it), 'items')"

      - name: Check web app manifest and its icons exist
        run: python3 -c "import json,os; m=json.load(open('_site/site.webmanifest')); [print(i['src'], i['sizes']) or os.stat('_site'+i['src']) for i in m['icons']]"

      - name: Check OpenSearch description is valid XML with a search template
        run: python3 -c "import xml.etree.ElementTree as E; r=E.parse('_site/opensearch.xml').getroot(); u=[x.get('template') for x in r.iter('{http://a9.com/-/spec/opensearch/1.1/}Url')]; print(u); assert any('/search/?q={searchTerms}' in t for t in u)"

      - name: Check stylesheet URL carries a content-hash version
        run: python3 -c "import re,hashlib; h=open('_site/index.html').read(); m=re.search(r'/assets/css/style\.css\?v=([0-9a-f]{10})\"', h); assert m, 'style.css link has no ?v= hash'; d=hashlib.md5(open('_site/assets/css/style.css','rb').read()).hexdigest()[:10]; assert m.group(1)==d, (m.group(1), d); print('style.css?v='+d)"

      - name: Check internal links (warnings only, never blocks deploy)
        run: python3 scripts/check_links.py _site
        continue-on-error: true

      - name: Accessibility lint (warnings only, never blocks deploy)
        run: python3 scripts/check_a11y.py _site
        continue-on-error: true

      - name: Structured data (JSON-LD) check (warnings only, never blocks deploy)
        run: python3 scripts/check_jsonld.py _site
        continue-on-error: true

      - name: SEO lint — titles, descriptions, canonical, one h1 (warnings only, never blocks deploy)
        run: python3 scripts/check_seo.py _site
        continue-on-error: true

      - name: Check llms.txt lists every page and has no dead links (warnings only, never blocks deploy)
        run: python3 scripts/check_llms.py _site
        continue-on-error: true

      - name: Microformats (h-entry on posts, h-card on homepage) check (warnings only, never blocks deploy)
        run: |
          python3 -m pip install --quiet --break-system-packages mf2py
          python3 scripts/check_mf2.py _site
        continue-on-error: true

      - name: Browser check — JS errors, sideways scroll at 375px, keyboard-reachable wide code, text contrast (warnings only, never blocks deploy)
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 scripts/check_browser.py _site  # + WCAG contrast pass in sepia and dark; uses the runner's preinstalled Google Chrome; offline, other hosts blocked
        continue-on-error: true
        timeout-minutes: 8

      - name: Check data files are current — events, now, changelog (warnings only, never blocks deploy)
        run: python3 scripts/check_data.py .
        continue-on-error: true

      - name: Check sitemap has lastmod dates
        run: python3 -c "import xml.etree.ElementTree as E; n='{http://www.sitemaps.org/schemas/sitemap/0.9}'; u=E.parse('_site/sitemap.xml').getroot().findall(n+'url'); m=[x for x in u if x.find(n+'lastmod') is None]; print('::notice title=sitemap::%d urls, %d without lastmod' % (len(u), len(m))); [print('  ', x.find(n+'loc').text) for x in m]"
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 from Oct 19, 2026; bump deliberately after a test run
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
