<script>
/* Section links on regular pages (/uses, /research, /events, /changelog, ...): every h2 in <main>
   gets a hover "#" link, like headings inside posts. Page h2s carry server-rendered ids (same slug
   rule as below: '&' -> ' and ', non-alphanumerics -> '-') so links work without JS; the fallback covers new ones. */
(function(){
  var main=document.getElementById('main'); if(!main) return;
  var made=false;
  main.querySelectorAll('h2').forEach(function(h){
    if(h.closest('[hidden], .post-content')||h.querySelector('.heading-anchor')) return;
    var text=h.textContent.replace(/\s+/g,' ').trim(); if(!text) return;
    if(!h.id){
      var base=text.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'section';
      var id=base, n=2;
      while(document.getElementById(id)){ id=base+'-'+(n++); }
      h.id=id; made=true;
    }
    var a=document.createElement('a');
    a.className='heading-anchor'; a.href='#'+h.id;
    a.setAttribute('aria-label','Link to section: '+text);
    a.textContent='#';
    h.appendChild(a);
    h.classList.add('has-anchor');
  });
  // ids were added after load, so a shared #link needs one manual jump
  if(made&&location.hash.length>1){
    var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if(t&&t.classList.contains('has-anchor')) t.scrollIntoView();
  }
})();
</script>
