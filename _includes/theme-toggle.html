<div class="theme-toggle" role="group" aria-label="Color theme">
  <span class="theme-toggle-label">Sepia</span>
  <button type="button" class="theme-slider" role="switch" aria-checked="false" aria-label="Dark mode">
    <span class="theme-slider-thumb"></span>
  </button>
  <span class="theme-toggle-label">Dark</span>
</div>

<script>
(function() {
  var STORAGE_KEY = 'blog_color_theme';
  var SLIDER = document.querySelector('.theme-slider');
  if (!SLIDER) return;

  function getStored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function setStored(theme) {
    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
  }

  function apply(theme, fromStorage) {
    document.body.className = 'theme-' + theme;
    if (!fromStorage) setStored(theme);
    var isDark = theme === 'dark';
    SLIDER.setAttribute('aria-checked', isDark ? 'true' : 'false');
    SLIDER.classList.toggle('is-dark', isDark);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isDark ? '#1e1b16' : '#e8e0cc');
    var scheme = document.querySelector('meta[name="color-scheme"]');
    if (scheme) scheme.setAttribute('content', isDark ? 'dark' : 'light');
  }

  var stored = getStored();
  if (stored === 'dark' || stored === 'sepia') {
    apply(stored);
  } else {
    var current = (document.body.className.match(/theme-(\w+)/) || [])[1];
    apply(current === 'dark' ? 'dark' : 'sepia');
  }

  SLIDER.addEventListener('click', function() {
    apply(SLIDER.getAttribute('aria-checked') === 'true' ? 'sepia' : 'dark');
  });

  /* Keep every open tab in step: another tab toggled the theme (storage event),
     or this page came back from the back/forward cache after a toggle elsewhere. */
  function syncFromStore() {
    var t = getStored();
    var now = SLIDER.getAttribute('aria-checked') === 'true' ? 'dark' : 'sepia';
    if ((t === 'dark' || t === 'sepia') && t !== now) apply(t, true);
  }
  window.addEventListener('storage', function(e) {
    if (e.key === STORAGE_KEY) syncFromStore();
  });
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) syncFromStore();
  });
})();
</script>
