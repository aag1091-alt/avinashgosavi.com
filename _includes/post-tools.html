<script>
(function(){
  var root=document.querySelector('.post-content'); if(!root) return;
  // Table of contents for long posts (box rendered by _layouts/post.html when >= 1,200 words)
  var toc=document.querySelector('.post-toc');
  if(toc){
    var hs=root.querySelectorAll('h2[id]'), list=toc.querySelector('ol');
    if(hs.length>=3){
      hs.forEach(function(h){
        var li=document.createElement('li'), a=document.createElement('a');
        a.href='#'+h.id; a.textContent=h.textContent.trim();
        li.appendChild(a); list.appendChild(li);
      });
      if(window.matchMedia('(min-width: 700px)').matches) toc.open=true;
      toc.hidden=false;
      // Highlight the section being read
      if('IntersectionObserver' in window){
        var links={}, cur=null;
        list.querySelectorAll('a').forEach(function(a){ links[a.hash.slice(1)]=a; });
        var mark=function(id){
          if(cur===id||!links[id]) return;
          if(cur&&links[cur]) links[cur].removeAttribute('aria-current');
          links[id].setAttribute('aria-current','true'); cur=id;
        };
        var io=new IntersectionObserver(function(){
          // current = last h2 whose top is above 30% of the viewport
          var line=window.innerHeight*0.3, id=hs[0].id;
          hs.forEach(function(h){ if(h.getBoundingClientRect().top<=line) id=h.id; });
          mark(id);
        },{rootMargin:'0px 0px -70% 0px'});
        hs.forEach(function(h){ io.observe(h); });
      }
    }
  }
  // Back-to-top button on long posts (appears after scrolling 1.5 screens)
  if(toc){
    var top=document.createElement('a');
    top.href='#'; top.className='back-to-top'; top.hidden=true;
    top.setAttribute('aria-label','Back to top'); top.textContent='\u2191 Top';
    top.addEventListener('click',function(ev){
      ev.preventDefault();
      var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0,behavior:still?'auto':'smooth'});
      var h1=document.querySelector('h1'); if(h1){ h1.setAttribute('tabindex','-1'); h1.focus({preventScroll:true}); }
    });
    document.body.appendChild(top);
    var ticking=false;
    window.addEventListener('scroll',function(){
      if(ticking) return; ticking=true;
      requestAnimationFrame(function(){ top.hidden=window.scrollY<window.innerHeight*1.5; ticking=false; });
    },{passive:true});
  }
  // Heading anchor links (kramdown gives h2/h3 ids)
  root.querySelectorAll('h2[id], h3[id]').forEach(function(h){
    var a=document.createElement('a');
    a.className='heading-anchor'; a.href='#'+h.id;
    a.setAttribute('aria-label','Link to section: '+h.textContent.trim());
    a.textContent='#';
    h.appendChild(a);
  });
  // Wide tables scroll sideways inside their own box instead of pushing the page wider on phones
  root.querySelectorAll('table').forEach(function(t){
    // The post layout already wraps tables server-side (works without JS); wrap any stragglers here
    var w=t.parentNode;
    if(!w.classList.contains('table-scroll')){ w=document.createElement('div'); w.className='table-scroll'; t.parentNode.insertBefore(w,t); w.appendChild(t); }
    var fit=function(){
      var wide=w.scrollWidth>w.clientWidth+1;
      w.classList.toggle('is-wide',wide);
      if(wide){ w.tabIndex=0; w.setAttribute('role','region'); w.setAttribute('aria-label','Table, scrolls sideways'); }
      else { w.removeAttribute('tabindex'); w.removeAttribute('role'); w.removeAttribute('aria-label'); }
    };
    fit();
    if('ResizeObserver' in window) new ResizeObserver(fit).observe(w);
  });
  // GFM task-list checkboxes (kramdown) have no label: name each one after its list item text
  root.querySelectorAll('input.task-list-item-checkbox, li.task-list-item > input[type=checkbox]').forEach(function(c){
    if(c.getAttribute('aria-label')||c.labels&&c.labels.length) return;
    var t=(c.parentNode.textContent||'').replace(/\s+/g,' ').trim();
    if(t) c.setAttribute('aria-label',t);
  });
  // Language tab on fenced code blocks (kramdown/Rouge put it in the wrapper's class: language-python)
  var langOf=function(box){
    var m=/(?:^|\s)language-([\w+#-]+)/.exec(box.className||'');
    return m&&!/^(plaintext|text|plain|none|console)$/i.test(m[1])?m[1].toLowerCase():'';
  };
  root.querySelectorAll('div.highlighter-rouge').forEach(function(box){
    var lang=langOf(box); if(!lang||box.querySelector('.code-lang')) return;
    var tag=document.createElement('span');
    tag.className='code-lang'; tag.textContent=lang;
    box.insertBefore(tag,box.firstChild);
    box.classList.add('has-lang');
  });
  // Tap/click a post image to see it full size (only when it's shown noticeably smaller than its file)
  if(window.HTMLDialogElement){
    var biggest=function(img){
      var best={w:+img.getAttribute('width')||0,src:img.src}, pic=img.closest('picture');
      var sets=[img.getAttribute('srcset')||''];
      if(pic) pic.querySelectorAll('source').forEach(function(s){ sets.push(s.getAttribute('srcset')||''); });
      sets.forEach(function(set){
        set.split(',').forEach(function(c){
          var p=c.trim().split(/\s+/), m=/^(\d+)w$/.exec(p[1]||'');
          if(p[0]&&m&&+m[1]>=best.w) best={w:+m[1],src:p[0]};
          else if(p[0]&&!p[1]&&!best.webp&&pic){ best.src=p[0]; best.webp=true; }
        });
      });
      return best;
    };
    var imgs=[].filter.call(root.querySelectorAll('img'),function(i){ return !i.closest('a, .diagram'); });
    if(imgs.length){
      var dlg=document.createElement('dialog'), big=document.createElement('img'), cap=document.createElement('p'), x=document.createElement('button'), opener=null;
      dlg.className='img-viewer'; dlg.setAttribute('aria-label','Enlarged image');
      x.type='button'; x.className='img-viewer-close'; x.textContent='Close';
      cap.className='img-viewer-cap'; big.decoding='async';
      dlg.appendChild(x); dlg.appendChild(big); dlg.appendChild(cap); document.body.appendChild(dlg);
      x.addEventListener('click',function(){ dlg.close(); });
      dlg.addEventListener('click',function(e){ if(e.target===dlg||e.target===big) dlg.close(); });
      dlg.addEventListener('close',function(){ big.removeAttribute('src'); if(opener) opener.focus(); });
      var open=function(img){
        var b=biggest(img); opener=img;
        big.src=b.src; big.alt=img.alt||''; cap.textContent=img.alt||''; cap.hidden=!img.alt;
        dlg.showModal(); x.focus();
      };
      var fit=function(){
        imgs.forEach(function(img){
          var on=img.clientWidth>0&&biggest(img).w>img.clientWidth*1.25;
          if(on===img.classList.contains('is-zoomable')) return;
          img.classList.toggle('is-zoomable',on);
          if(on){ img.tabIndex=0; img.setAttribute('role','button'); img.setAttribute('aria-label','Enlarge image'+(img.alt?': '+img.alt:'')); }
          else { img.removeAttribute('tabindex'); img.removeAttribute('role'); img.removeAttribute('aria-label'); }
        });
      };
      imgs.forEach(function(img){
        img.addEventListener('click',function(){ if(img.classList.contains('is-zoomable')) open(img); });
        img.addEventListener('keydown',function(e){
          if(img.classList.contains('is-zoomable')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); open(img); }
        });
      });
      fit();
      if('ResizeObserver' in window){ var ro=new ResizeObserver(fit); imgs.forEach(function(i){ ro.observe(i); }); }
    }
  }
  // Copy buttons on code blocks
  if(!navigator.clipboard) return;
  var said=document.createElement('span');
  said.className='visually-hidden'; said.setAttribute('role','status'); said.setAttribute('aria-live','polite');
  document.body.appendChild(said);
  var say=function(t){ said.textContent=''; setTimeout(function(){ said.textContent=t; },50); };
  root.querySelectorAll('pre').forEach(function(pre){
    var box=pre.closest('.highlighter-rouge')||pre;
    if(box.querySelector('.code-copy')) return;
    var lang=langOf(box);
    var b=document.createElement('button');
    b.type='button'; b.className='code-copy'; b.textContent='Copy';
    b.setAttribute('aria-label','Copy '+(lang?lang+' ':'')+'code to clipboard');
    b.addEventListener('click',function(){
      var code=pre.querySelector('code')||pre;
      navigator.clipboard.writeText(code.innerText.replace(/\n$/,'')).then(function(){
        b.textContent='Copied'; say('Code copied to clipboard');
        setTimeout(function(){ b.textContent='Copy'; },1500);
      },function(){ b.textContent='Press Ctrl+C'; say('Copy failed. Select the code and press Ctrl+C'); });
    });
    box.classList.add('has-copy');
    box.appendChild(b);
  });
})();
</script>
