<figure class="diagram">
<svg viewBox="0 0 360 418" role="img" aria-labelledby="hnsw-dg-title hnsw-dg-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hnsw-dg-title">How an HNSW search hops down the layers</title>
  <desc id="hnsw-dg-desc">A sketch of three stacked neighbor graphs. The top layer has only two items joined by one long link; the middle layer has four; the bottom layer has every item, each linked to close neighbors. A search starts at the entry point on the top layer, hops to the neighbor closer to the query, and when no neighbor is closer it drops to the same item one layer down and continues. On the bottom layer it keeps a list of ef candidates around the query and returns the best k.</desc>

    <marker id="hnsw-dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="dg-label" x="22" y="30">Layer 2</text>
  <text class="dg-note" x="92" y="30">few items · long links</text>
  <rect class="dg-group" x="10" y="108" width="340" height="84" rx="12"/>
  <text class="dg-label" x="22" y="128">Layer 1</text>
  <rect class="dg-group" x="10" y="206" width="340" height="124" rx="12"/>
  <text class="dg-label" x="22" y="226">Layer 0</text>
  <text class="dg-note" x="92" y="226">every item · short links</text>

  <line class="dg-edge" x1="224" y1="280" x2="250" y2="264"/>
  <line class="dg-edge" x1="250" y1="264" x2="278" y2="286"/>
  <line class="dg-edge" x1="278" y1="286" x2="304" y2="262"/>

  <text class="dg-strong" x="22" y="356">1</text>
  <text class="dg-body" x="42" y="356">Start at the entry point on the top layer</text>
  <text class="dg-strong" x="22" y="376">2</text>
  <text class="dg-body" x="42" y="376">Hop to the neighbor closest to the query</text>
  <text class="dg-strong" x="22" y="396">3</text>
  <text class="dg-body" x="42" y="396">No closer neighbor? Drop down a layer</text>
  <text class="dg-strong" x="22" y="416">4</text>
  <text class="dg-body" x="42" y="416">At the bottom, return the best k</text>

<figcaption>A sketch, not real data: upper layers let the search take long jumps, the bottom layer lets it finish the job up close.</figcaption>
</figure>
