<figure class="diagram">
<svg viewBox="0 0 336 422" role="img" aria-labelledby="vm-tq-title vm-tq-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="vm-tq-title">How VaultMem splits a natural-language time query</title>
  <desc id="vm-tq-desc">The query "what happened summer 2019" goes to TimeQueryParser.parse, which runs in pure Python with no dependencies. It splits the query in two. The time phrase, summer 2019, becomes a timestamp range from 2019-06-01 to 2019-09-01 UTC. The remainder, what happened, is what gets embedded. search with parse_time=True uses both, so the results come from summer 2019 instead of from all time.</desc>
  <defs>
    <marker id="vm-tq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="dg-pill" x="24" y="8" width="288" height="40" rx="20"/>
  <text class="dg-body dg-mono" x="168" y="33" text-anchor="middle">"what happened summer 2019"</text>
  <line class="dg-line" x1="168" y1="48" x2="168" y2="70" marker-end="url(#vm-tq-arrow)"/>
  <rect class="dg-box" x="24" y="72" width="288" height="54" rx="8"/>
  <text class="dg-strong" x="168" y="94" text-anchor="middle">TimeQueryParser.parse()</text>
  <text class="dg-note" x="168" y="115" text-anchor="middle">pure Python, no dependencies</text>
  <line class="dg-line" x1="90" y1="126" x2="90" y2="166" marker-end="url(#vm-tq-arrow)"/>
  <line class="dg-line" x1="246" y1="126" x2="246" y2="166" marker-end="url(#vm-tq-arrow)"/>
  <rect class="dg-box" x="16" y="168" width="148" height="90" rx="8"/>
  <text class="dg-note" x="90" y="188" text-anchor="middle">time phrase</text>
  <text class="dg-strong" x="90" y="212" text-anchor="middle">summer 2019</text>
  <text class="dg-note dg-mono" x="90" y="232" text-anchor="middle">from 2019-06-01</text>
  <text class="dg-note dg-mono" x="90" y="248" text-anchor="middle">to 2019-09-01</text>
  <rect class="dg-box" x="172" y="168" width="148" height="90" rx="8"/>
  <text class="dg-note" x="246" y="188" text-anchor="middle">remainder</text>
  <text class="dg-strong" x="246" y="212" text-anchor="middle">what happened</text>
  <text class="dg-note" x="246" y="232" text-anchor="middle">this part is</text>
  <text class="dg-note" x="246" y="248" text-anchor="middle">embedded</text>
  <line class="dg-line" x1="90" y1="258" x2="90" y2="296" marker-end="url(#vm-tq-arrow)"/>
  <line class="dg-line" x1="246" y1="258" x2="246" y2="296" marker-end="url(#vm-tq-arrow)"/>
  <rect class="dg-box" x="24" y="298" width="288" height="54" rx="8"/>
  <text class="dg-strong" x="168" y="320" text-anchor="middle">search(…, parse_time=True)</text>
  <text class="dg-note" x="168" y="341" text-anchor="middle">time range + embedding together</text>
  <line class="dg-line" x1="168" y1="352" x2="168" y2="372" marker-end="url(#vm-tq-arrow)"/>
  <rect class="dg-pill" x="24" y="374" width="288" height="40" rx="20"/>
  <text class="dg-body" x="168" y="399" text-anchor="middle">Results from summer 2019, not all time</text>
</svg>
<figcaption>The time phrase becomes a timestamp range; only what's left of the query is embedded.</figcaption>
</figure>
