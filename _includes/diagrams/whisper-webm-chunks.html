<figure class="diagram">
<svg viewBox="0 0 336 420" role="img" aria-labelledby="wh-wc-title wh-wc-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="wh-wc-title">Why single WebM chunks fail and accumulated audio works</title>
  <desc id="wh-wc-desc">MediaRecorder fires one blob every N milliseconds. Only chunk 1 carries the WebM file header; chunks 2 and 3 are raw audio. Sending chunk 2 on its own fails: ffmpeg has no header, so it can't decode it and the transcript comes back silent. The fix sends everything recorded so far on each event: chunk 1, then chunks 1 and 2, then chunks 1, 2 and 3. Each request starts with the header, so each is a valid WebM file, and each new transcript replaces the last one.</desc>
  <defs>
    <marker id="wh-wc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <text class="dg-note" x="168" y="16" text-anchor="middle">MediaRecorder: one blob every N ms</text>
  <rect class="dg-box" x="16" y="28" width="120" height="44" rx="6"/>
  <rect class="dg-pill" x="22" y="34" width="58" height="32" rx="4"/>
  <text class="dg-body dg-mono" x="51" y="54" text-anchor="middle">header</text>
  <text class="dg-body" x="108" y="55" text-anchor="middle">audio</text>
  <rect class="dg-box" x="144" y="28" width="84" height="44" rx="6"/>
  <text class="dg-body" x="186" y="55" text-anchor="middle">audio</text>
  <rect class="dg-box" x="236" y="28" width="84" height="44" rx="6"/>
  <text class="dg-body" x="278" y="55" text-anchor="middle">audio</text>
  <text class="dg-note" x="76" y="90" text-anchor="middle">chunk 1</text>
  <text class="dg-note" x="186" y="90" text-anchor="middle">chunk 2</text>
  <text class="dg-note" x="278" y="90" text-anchor="middle">chunk 3</text>

  <rect class="dg-group" x="8" y="104" width="320" height="92" rx="12"/>
  <text class="dg-label" x="24" y="124">Send one chunk</text>
  <rect class="dg-box dg-muted" x="24" y="138" width="84" height="44" rx="6"/>
  <text class="dg-body" x="66" y="165" text-anchor="middle">audio</text>
  <line class="dg-line dg-dash" x1="110" y1="160" x2="138" y2="160" marker-end="url(#wh-wc-arrow)"/>
  <text class="dg-body" x="146" y="155">ffmpeg: no header,</text>
  <text class="dg-body" x="146" y="174">can't decode → silence</text>

  <rect class="dg-group" x="8" y="212" width="320" height="140" rx="12"/>
  <text class="dg-label" x="24" y="232">Send everything so far</text>
  <text class="dg-note" x="24" y="264">event 1</text>
  <rect class="dg-pill" x="80" y="246" width="32" height="28" rx="4"/>
  <text class="dg-body" x="96" y="265" text-anchor="middle">1</text>
  <text class="dg-note" x="24" y="300">event 2</text>
  <rect class="dg-pill" x="80" y="282" width="32" height="28" rx="4"/>
  <text class="dg-body" x="96" y="301" text-anchor="middle">1</text>
  <rect class="dg-box" x="116" y="282" width="32" height="28" rx="4"/>
  <text class="dg-body" x="132" y="301" text-anchor="middle">2</text>
  <text class="dg-note" x="24" y="336">event 3</text>
  <rect class="dg-pill" x="80" y="318" width="32" height="28" rx="4"/>
  <text class="dg-body" x="96" y="337" text-anchor="middle">1</text>
  <rect class="dg-box" x="116" y="318" width="32" height="28" rx="4"/>
  <text class="dg-body" x="132" y="337" text-anchor="middle">2</text>
  <rect class="dg-box" x="152" y="318" width="32" height="28" rx="4"/>
  <text class="dg-body" x="168" y="337" text-anchor="middle">3</text>
  <line class="dg-line" x1="196" y1="296" x2="222" y2="296" marker-end="url(#wh-wc-arrow)"/>
  <text class="dg-body" x="230" y="292">valid WebM</text>
  <text class="dg-note" x="230" y="310">every time</text>

  <line class="dg-line" x1="168" y1="354" x2="168" y2="372" marker-end="url(#wh-wc-arrow)"/>
  <rect class="dg-pill" x="24" y="374" width="288" height="40" rx="20"/>
  <text class="dg-body" x="168" y="399" text-anchor="middle">Each transcript replaces the last</text>
</svg>
<figcaption>Only the first chunk carries the WebM header (shaded), so every request resends audio from the start.</figcaption>
</figure>
