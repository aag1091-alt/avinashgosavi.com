<figure class="diagram">
<svg viewBox="0 0 360 300" role="img" aria-labelledby="litm-dg-title litm-dg-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="litm-dg-title">The U-shaped curve from Lost in the Middle</title>
  <desc id="litm-dg-desc">A qualitative sketch, not the paper's data. The horizontal axis is where the one useful passage sits in a prompt of many passages, from first to last. The vertical axis is answer accuracy. The curve is high when the passage is first (primacy bias), dips lowest when it is in the middle, and rises again when it is last (recency bias).</desc>
  <text class="dg-label" x="50" y="18">Answer accuracy</text>
  <line class="dg-axis" x1="50" y1="28" x2="50" y2="206"/>
  <line class="dg-axis" x1="50" y1="206" x2="340" y2="206"/>
  <path class="dg-line dg-curve" d="M70 52 C120 175 269 175 319 70"/>
  <circle class="dg-dot" cx="70" cy="52" r="5"/>
  <circle class="dg-dot" cx="194.5" cy="146.5" r="5"/>
  <circle class="dg-dot" cx="319" cy="70" r="5"/>
  <text class="dg-body" x="82" y="48">primacy</text>
  <text class="dg-body" x="307" y="56" text-anchor="end">recency</text>
  <text class="dg-strong" x="194.5" y="180" text-anchor="middle">lost in the middle</text>
  <rect class="dg-pill" x="58" y="218" width="25" height="18" rx="4"/>
  <rect class="dg-box dg-muted" x="89" y="218" width="25" height="18" rx="4"/>

  <rect class="dg-box dg-muted" x="182" y="218" width="25" height="18" rx="4"/>
  <rect class="dg-box dg-muted" x="213" y="218" width="25" height="18" rx="4"/>
  <rect class="dg-box dg-muted" x="244" y="218" width="25" height="18" rx="4"/>
  <rect class="dg-box dg-muted" x="275" y="218" width="25" height="18" rx="4"/>
  <rect class="dg-pill" x="306" y="218" width="25" height="18" rx="4"/>
  <text class="dg-note" x="70.5" y="256" text-anchor="middle">first</text>
  <text class="dg-note" x="194.5" y="256" text-anchor="middle">middle</text>
  <text class="dg-note" x="318.5" y="256" text-anchor="middle">last</text>
  <text class="dg-label" x="194.5" y="284" text-anchor="middle">Where the answer passage sits</text>
</svg>
<figcaption>A sketch of the shape the paper reports, not its numbers: the same passage helps most at the edges of the prompt and least in the middle.</figcaption>
