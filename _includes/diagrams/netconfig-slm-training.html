<figure class="diagram">
<svg viewBox="0 0 360 660" role="img" aria-labelledby="slm-train-title slm-train-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="slm-train-title">How the small network model gets its data and training</title>
  <desc id="slm-train-desc">The loop starts with a plain-English intent, such as add VLAN 20 on sw1. First, draft the config, from Cisco config guides and a bigger model. Second, run it in the simulator: containerlab or Cisco CML boots a device with this config. Third, log the result: pass or fail plus the output is saved as one dataset row, and failures are fixed and retried or dropped. Fourth, the dataset grows: every logged pass is kept, target about 5,000 intent-to-config pairs. Fifth, fine-tune Qwen3-4B with QLoRA on a rented RTX 4090, 2 to 4 hours, about 2 to 3 dollars. Sixth, test in the simulator on new intents the model never saw, and score how many pass. Then publish on Hugging Face and Ollama, and repeat the same loop with the smaller 1.7B and 0.6B models.</desc>
  <defs>
    <marker id="slm-train-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="dg-pill" x="22" y="8" width="268" height="40" rx="20"/>
  <text class="dg-body" x="156" y="33" text-anchor="middle">Intent: "Add VLAN 20 on sw1"</text>
  <line class="dg-line" x1="156" y1="48" x2="156" y2="68" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-box" x="22" y="70" width="268" height="64" rx="8"/>
  <text class="dg-strong" x="156" y="94" text-anchor="middle">1. Draft the config</text>
  <text class="dg-note" x="156" y="112" text-anchor="middle">Cisco config guides + a bigger model</text>
  <text class="dg-note" x="156" y="127" text-anchor="middle">writes the first version</text>
  <line class="dg-line" x1="156" y1="134" x2="156" y2="154" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-box" x="22" y="156" width="268" height="64" rx="8"/>
  <text class="dg-strong" x="156" y="180" text-anchor="middle">2. Run it in the simulator</text>
  <text class="dg-note" x="156" y="198" text-anchor="middle">containerlab / Cisco CML</text>
  <text class="dg-note" x="156" y="213" text-anchor="middle">a device boots with this config</text>
  <line class="dg-line" x1="156" y1="220" x2="156" y2="240" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-box" x="22" y="242" width="268" height="64" rx="8"/>
  <text class="dg-strong" x="156" y="266" text-anchor="middle">3. Log the result</text>
  <text class="dg-note" x="156" y="284" text-anchor="middle">pass or fail, plus the output</text>
  <text class="dg-note" x="156" y="299" text-anchor="middle">saved as one dataset row</text>
  <path class="dg-line dg-dash" d="M290 274 H326 V188 H294" marker-end="url(#slm-train-arrow)"/>
  <text class="dg-note" transform="translate(346 231) rotate(-90)" text-anchor="middle">failures: fix and retry, or drop</text>
  <line class="dg-line" x1="156" y1="306" x2="156" y2="326" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-box" x="22" y="328" width="268" height="64" rx="8"/>
  <text class="dg-strong" x="156" y="352" text-anchor="middle">4. The dataset grows</text>
  <text class="dg-note" x="156" y="370" text-anchor="middle">every logged pass is kept</text>
  <text class="dg-note" x="156" y="385" text-anchor="middle">target: ~5,000 intent → config pairs</text>
  <line class="dg-line" x1="156" y1="392" x2="156" y2="412" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-box" x="22" y="414" width="268" height="64" rx="8"/>
  <text class="dg-strong" x="156" y="438" text-anchor="middle">5. Fine-tune Qwen3-4B</text>
  <text class="dg-note" x="156" y="456" text-anchor="middle">QLoRA on a rented RTX 4090</text>
  <text class="dg-note" x="156" y="471" text-anchor="middle">2–4 hours · about $2–3</text>
  <line class="dg-line" x1="156" y1="478" x2="156" y2="498" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-box" x="22" y="500" width="268" height="64" rx="8"/>
  <text class="dg-strong" x="156" y="524" text-anchor="middle">6. Test in the simulator</text>
  <text class="dg-note" x="156" y="542" text-anchor="middle">new intents the model never saw</text>
  <text class="dg-note" x="156" y="557" text-anchor="middle">score: how many pass</text>
  <line class="dg-line" x1="156" y1="564" x2="156" y2="584" marker-end="url(#slm-train-arrow)"/>
  <rect class="dg-pill" x="22" y="586" width="268" height="40" rx="20"/>
  <text class="dg-body" x="156" y="611" text-anchor="middle">Publish: Hugging Face + Ollama</text>
  <text class="dg-note" x="156" y="646" text-anchor="middle">then the same loop with 1.7B and 0.6B</text>
</svg>
<figcaption>The loop that builds the dataset: draft a config, run it in the simulator, log what happened. Only the passes become training data. Then fine-tune, test in the same simulator, and publish.</figcaption>
</figure>
