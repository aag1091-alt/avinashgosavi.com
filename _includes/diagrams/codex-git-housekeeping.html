<figure class="diagram">
<svg viewBox="0 0 336 560" role="img" aria-labelledby="cxgit-dg-title cxgit-dg-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cxgit-dg-title">Small git skills chained into one combined housekeeping skill</title>
  <desc id="cxgit-dg-desc">One prompt runs the combined skill, which chains four small skills in order. New branch: create a branch from the right base, such as main, with the team's naming convention. Update from origin: stash current changes, pull from origin/main, re-apply the stash and handle conflicts if needed. Commit: generate the commit message from a template covering what changed, why and the scope. Push: push the branch and set upstream if needed. Each step is also a small skill that can be run on its own.</desc>
  <defs>
    <marker id="cxgit-dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="dg-pill" x="88" y="10" width="160" height="44" rx="22"/>
  <text class="dg-strong" x="168" y="38" text-anchor="middle">One prompt</text>
  <line class="dg-line" x1="168" y1="54" x2="168" y2="80" marker-end="url(#cxgit-dg-arrow)"/>

  <rect class="dg-group" x="10" y="84" width="316" height="396" rx="10"/>
  <text class="dg-label" x="24" y="106">Combined skill: full flow</text>

  <rect class="dg-box" x="22" y="118" width="292" height="64" rx="8"/>
  <text class="dg-strong" x="36" y="143">1 · New branch</text>
  <text class="dg-note" x="36" y="167">from <tspan class="dg-mono">main</tspan>, using the naming convention</text>
  <line class="dg-line" x1="168" y1="182" x2="168" y2="208" marker-end="url(#cxgit-dg-arrow)"/>

  <rect class="dg-box" x="22" y="210" width="292" height="64" rx="8"/>
  <text class="dg-strong" x="36" y="235">2 · Update from origin</text>
  <text class="dg-note" x="36" y="259">stash → pull <tspan class="dg-mono">origin/main</tspan> → re-apply</text>
  <line class="dg-line" x1="168" y1="274" x2="168" y2="300" marker-end="url(#cxgit-dg-arrow)"/>

  <rect class="dg-box" x="22" y="302" width="292" height="64" rx="8"/>
  <text class="dg-strong" x="36" y="327">3 · Commit</text>
  <text class="dg-note" x="36" y="351">message from a template: what, why, scope</text>
  <line class="dg-line" x1="168" y1="366" x2="168" y2="392" marker-end="url(#cxgit-dg-arrow)"/>

  <rect class="dg-box" x="22" y="394" width="292" height="64" rx="8"/>
  <text class="dg-strong" x="36" y="419">4 · Push</text>
  <text class="dg-note" x="36" y="443">push the branch, set upstream if needed</text>

  <text class="dg-body" x="168" y="512" text-anchor="middle">Each step is also a small skill</text>
  <text class="dg-body" x="168" y="534" text-anchor="middle">you can run on its own.</text>
</svg>
<figcaption>Small skills you can mix, or run as one.</figcaption>
</figure>
