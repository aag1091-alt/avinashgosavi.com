# Papershelf on /research. Each: title, authors, year, venue, url, topic,
# tldr (what the paper says), why (how it shaped my work), post (optional).
- title: "Memory as Asset: From Agent-centric to Human-centric Memory Management"
  authors: Pan, Huang & Yang
  year: 2026
  venue: arXiv:2603.14212
  url: https://arxiv.org/abs/2603.14212
  tldr_post: /post/paper-tldr-memory-as-asset/
  topic: Agent memory & privacy
  tldr: >-
    Argues that today's agent memory is built for the agent, not the person,
    and proposes treating personal memories as assets people own, share
    under permissions and evolve over time — with a three-layer design of
    personal storage, an evolution layer and a memory exchange network.
  why: >-
    The paper that shaped VaultMem's whole design. VaultMem implements its
    first layer: memory the platform operator cryptographically cannot read.
  post: /post/vaultmem-your-ai-agent-shouldnt-read-your-diary/
- title: Evaluating Very Long-Term Conversational Memory of LLM Agents (LoCoMo)
  authors: Maharana et al.
  year: 2024
  venue: arXiv:2402.17753
  url: https://arxiv.org/abs/2402.17753
  tldr_post: /post/paper-tldr-locomo-long-term-memory-benchmark/
  topic: Agent memory & privacy
  tldr: >-
    Introduces LoCoMo, a benchmark of very long multi-session conversations
    with question-answering across single-hop, multi-hop, temporal,
    adversarial and open-domain categories — and shows long-context LLMs and
    RAG still struggle with long-range memory.
  why: >-
    I used its 1,982 QA pairs to evaluate VaultMem's retrieval instead of my
    own small synthetic benchmark.
  post: /post/vaultmem-part-2-multimodal-temporal-backends/
- title: Neural networks and physical systems with emergent collective computational abilities
  authors: J.J. Hopfield
  year: 1982
  venue: PNAS 79(8)
  url: https://www.pnas.org/doi/10.1073/pnas.79.8.2554
  topic: Brain-inspired memory
  tldr: >-
    A network of simple binary neurons with symmetric connections has an
    energy function that only goes down as it updates, so stored patterns
    become stable "attractors" — feed it a partial or noisy cue and it
    settles on the full memory. Content-addressable memory from physics.
  why: >-
    The starting point for Attractor, my memory engine that retrieves by
    partial cues and context instead of keys or nearest-neighbour distance.
  post: /post/attractor-memory-engine/
- title: Hopfield Networks is All You Need
  authors: Ramsauer, Schäfl, Lehner et al.
  year: 2020
  venue: arXiv:2008.02217
  url: https://arxiv.org/abs/2008.02217
  tldr_post: /post/paper-tldr-hopfield-networks-is-all-you-need/
  topic: Brain-inspired memory
  tldr: >-
    A continuous "modern" Hopfield network can store exponentially many
    patterns and retrieve them in one update — and that update rule is
    exactly transformer attention.
  why: >-
    The bridge between 1982 associative memory and today's LLMs, and the
    reason I think attractor-style retrieval is worth revisiting for agents.
  post: /post/attractor-memory-engine/
- title: Why there are complementary learning systems in the hippocampus and neocortex
  authors: McClelland, McNaughton & O'Reilly
  year: 1995
  venue: Psychological Review 102(3)
  url: https://doi.org/10.1037/0033-295X.102.3.419
  tldr_post: /post/paper-tldr-complementary-learning-systems/
  topic: Brain-inspired memory
  tldr: >-
    The brain pairs a fast learner (hippocampus) that captures specific
    episodes with a slow learner (neocortex) that gradually extracts
    structure; replaying episodes into the slow system avoids catastrophic
    interference.
  why: >-
    Gave Attractor its model of consolidation — why some memories strengthen
    with use while others decay.
  post: /post/attractor-memory-engine/
- title: "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks"
  authors: Reimers & Gurevych
  year: 2019
  venue: arXiv:1908.10084
  url: https://arxiv.org/abs/1908.10084
  tldr_post: /post/paper-tldr-sentence-bert/
  topic: Retrieval & embeddings
  tldr: >-
    Fine-tunes BERT in a siamese setup so each sentence gets its own
    embedding comparable by cosine similarity — turning semantic search over
    many sentences from hours of pairwise BERT inference into seconds.
  why: >-
    The sentence-transformers models behind semantic search in Attractor,
    VaultMem and daylog all descend from this paper.
  post: /post/attractor-memory-engine/
