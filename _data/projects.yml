- name: Attractor
  tagline: Brain-inspired memory engine
  description: >-
    A memory engine modeled on Hopfield-style attractor dynamics — retrieval
    by partial cues and context rather than keys or nearest-neighbour
    distance.
  tags: [Python, Hopfield Networks, Memory]
  github: https://github.com/aag1091-alt/attractor
  post: /post/attractor-memory-engine/
  featured: true

- name: daylog
  tagline: Private voice diary
  description: >-
    A voice diary with semantic search where entries and the search index are
