- name: VaultMem
  tagline: Encrypted memory for AI agents
  description: >-
    A Python memory library where the platform running the agent
    cryptographically cannot read what users store. Client-side encryption,
    encrypted semantic search, PII sanitization. Published on PyPI with a
    preprint on Zenodo.
  tags: [Python, Cryptography, AI Agents]
  github: https://github.com/aag1091-alt/vaultmem-sdk
  post: /post/vaultmem-encrypted-memory-for-ai-agents/
  featured: true

