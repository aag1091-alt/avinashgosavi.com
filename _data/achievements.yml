# Achievements shown on /achievements, grouped by section.
# Each item: title, year, detail, optional link (url + label).
- section: Work I'm proud of
  items:
    - title: Helping bring Cisco Catalyst into the Meraki cloud
      year: 2021–now
      detail: >-
        Five years of laying the groundwork so Catalyst switches, wireless
        and routers can be managed from the Meraki Dashboard — starting with a
        small Electron app to onboard the very first switches.
    - title: Building wireless support from scratch
      detail: >-
        There was no Catalyst wireless on the platform when we started. Adding
        the wireless controller as a new kind of device, and watching real
        networks come online through it, is still one of my favorite projects.
    - title: Making one view of every network fast
      detail: >-
        The Global Overview API pulls Catalyst Center and Meraki data together
        across shards. Getting the biggest customers from timeouts to a
        few seconds taught me more about aggregation than any book.
    - title: Topology for Cisco Cloud Control
      year: 2026
      detail: >-
        Designing the topology data service behind Cisco Cloud Control, and
        seeing it shown at Cisco Live 2026, was a proud moment for the team.

