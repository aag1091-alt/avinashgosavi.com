title: Avinash Gosavi
tagline: Staff Software Engineer
description: "Portfolio and blog of Avinash Gosavi — Staff Software Engineer on distributed systems, API design and reliability, with privacy-first AI tools on the side."
baseurl: ""
url: "https://www.avinashgosavi.com"

# Color theme (CSS): white | off-white | light-gray | sepia | soft-blue | dark
color_theme: sepia

author:
  name: Avinash Gosavi
  username: aag1091

social_links:
  github: https://github.com/aag1091-alt
  linkedin: https://www.linkedin.com/in/aag1091/
  x: https://x.com/aag1091

# SEO / social previews (jekyll-seo-tag)
logo: /assets/images/about.jpg
twitter:
  username: aag1091
  card: summary_large_image
social:
  name: Avinash Gosavi
  links:
    - https://github.com/aag1091-alt
    - https://www.linkedin.com/in/aag1091/
    - https://x.com/aag1091
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/about.jpg

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false

highlighter: rouge

future: true

# A blog topic (post tag) gets its own Atom feed at /feed/topic/<slug>.xml once
# it has this many posts (_plugins/topic_feeds.rb and the /blog/ chips).
topic_feed_min: 2

permalink: /post/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - README.md
  - codex-skills-wix-copy.txt
